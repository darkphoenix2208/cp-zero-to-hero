}</textarea></div><div class="flex flex-col h-full bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden"><div class="bg-zinc-950 p-2 text-xs font-bold text-zinc-500 uppercase tracking-wider border-b border-zinc-800 flex justify-between items-center"><span>Optimized Sol  (JS)</span><span class="text-xs text-zinc-600">Fn: solve(input)</span></div><textarea class="flex-1 bg-zinc-900 p-4 font-mono text-sm text-yellow-300 resize-none focus:outline-none">// Greedy Solution (Fails for [1, 3, 4])
function solve(input) {
    let n = parseInt(input);
    const coins = [4, 3, 1]; // Sorted descending
    let count = 0;
    
    for(let c of coins) {
        while(n &gt;= c) {
            n -= c;
            count++;
        }
    }
    return count.toString();
}</textarea></div><div class="flex flex-col h-full bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden"><div class="bg-zinc-950 p-2 text-xs font-bold text-zinc-500 uppercase tracking-wider border-b border-zinc-800 flex justify-between items-center"><span>Brute Force (JS)</span><span class="text-xs text-zinc-600">Ref implementation</span></div><textarea class="flex-1 bg-zinc-900 p-4 font-mono text-sm text-blue-300 resize-none focus:outline-none">// Brute Force (Recursive/DP) - Correct
function solve(input) {
    const n = parseInt(input);
    const coins = [1, 3, 4];
    
    // Simple recursion for small N
    function minCoins(amount) {
        if(amount === 0) return 0;
        if(amount &lt; 0) return Infinity;
        
        let res = Infinity;
        for(let c of coins) {
            res = Math.min(res, minCoins(amount - c) + 1);
        }
        return res;
    }
    
    const ans = minCoins(n);
    return ans.toString();
